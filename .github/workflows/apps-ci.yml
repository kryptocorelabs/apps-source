name: Applications CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --workspace --locked --release

  windows-gui:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build --locked --release -p kryptocore-rescue -p kryptocore-desktop-engine
      - run: dotnet build apps/msg/windows/Msg.csproj -c Release
      - name: Build Container with its embedded worker
        shell: pwsh
        run: dotnet build apps/container/windows/Container.csproj -c Release "-p:DesktopEnginePath=$PWD/target/release/kryptocore-desktop-engine.exe"
      - name: Build Rescue with its embedded worker
        shell: pwsh
        run: dotnet build apps/rescue/windows/Rescue.csproj -c Release "-p:RescueEnginePath=$PWD/target/release/kryptocore-rescue.exe"
      - name: Render application design at normal and minimum sizes
        run: |
          dotnet build apps/desktop/tests/appearance/Appearance.csproj -c Release
          dotnet apps/desktop/tests/appearance/bin/Release/net10.0-windows/Appearance.dll apps/container/windows/bin/Release/net10.0-windows/KryptoCore-Container.dll Container dist/design-screenshots
          dotnet apps/desktop/tests/appearance/bin/Release/net10.0-windows/Appearance.dll apps/rescue/windows/bin/Release/net10.0-windows/KryptoCore-Rescue.dll Rescue dist/design-screenshots
          dotnet apps/desktop/tests/appearance/bin/Release/net10.0-windows/Appearance.dll apps/msg/windows/bin/Release/net10.0-windows/KryptoCore-MSG.dll Msg dist/design-screenshots
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: application-design-screenshots
          path: dist/design-screenshots/*.png
          if-no-files-found: error
      - name: Test per-contact message and draft isolation
        run: |
          dotnet build apps/msg/tests/windows/Check.csproj -o dist/msg-ui-check
          dotnet dist/msg-ui-check/Check.dll --session-only
      - name: Test bundled Tor integrity check
        run: dotnet dist/msg-ui-check/Check.dll --tor-integrity apps/msg/windows/bin/Release/net10.0-windows/KryptoCore-MSG.dll
      - name: Test Container shared signatures and scanner gates
        run: |
          dotnet build apps/container/tests/windows/Check.csproj -o dist/container-ui-check
          dotnet dist/container-ui-check/Check.dll apps/container/windows/bin/Release/net10.0-windows/KryptoCore-Container.dll
      - name: Test Rescue credential and export workflow
        run: |
          dotnet build apps/rescue/tests/windows/Check.csproj -o dist/rescue-ui-check
          dotnet dist/rescue-ui-check/Check.dll apps/rescue/windows/bin/Release/net10.0-windows/KryptoCore-Rescue.dll dist/container-ui-check/native-fixture.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: rescue-ui-check
          path: dist/rescue-ui-check/rescue.png
          if-no-files-found: ignore

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Check the shared dependency graph
        run: |
          cargo +stable metadata --locked --format-version 1 | jq -e '
            [.packages[] | select(.name == "kryptocore") | .source] as $core |
            [.packages[] | select(.name == "kryptocore-vault-format") | .source] as $format |
            ($core | length) == 1 and ($format | length) == 1 and
            ($core[0] | startswith("git+https://github.com/kryptocorelabs/kryptocore?rev=")) and
            ($format[0] | startswith("git+https://github.com/kryptocorelabs/vault-source?rev="))'
      - run: cargo +stable install --locked cargo-audit --version 0.22.2
      - run: cargo +stable audit --deny warnings
      - run: cargo +stable install --locked cargo-deny --version 0.19.9
      - run: cargo +stable deny --locked check --config deny.toml licenses
