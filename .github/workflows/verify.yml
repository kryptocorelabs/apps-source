name: Verify release manifests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-verifier:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked --release -p kryptocore-verify -- --test-threads=1
      - name: Package native verifier with license inventory
        run: python apps/verify/package.py dist/verify-native
      - uses: actions/upload-artifact@v6
        with:
          name: verify-native-${{ matrix.os }}
          path: |
            dist/verify-native/*.zip
            dist/verify-native/*.tar.gz
            dist/verify-native/*.txt
            dist/verify-native/*.json
          if-no-files-found: error
          compression-level: 0
